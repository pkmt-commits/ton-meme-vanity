<!doctype html>
<!-- Превью репозитория (docs/social-preview.png). Пересобрать: msedge --headless=new --window-size=1280,640 --virtual-time-budget=8000 --screenshot=social-preview.png social-preview.html -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg0: #050b14;
    --bg1: #0a1a2e;
    --ton: #0098ea;
    --ton-soft: #4fc3ff;
    --dim: #5f7a96;
    --text: #f2f7fc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg0); }
  body {
    position: relative;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 60% 55% at 50% 46%, rgba(0, 152, 234, 0.28), transparent 70%),
      radial-gradient(ellipse 90% 80% at 50% 120%, rgba(0, 152, 234, 0.18), transparent 70%),
      linear-gradient(160deg, var(--bg1), var(--bg0) 60%);
  }
  /* фон: строки «случайных» адресов */
  #noise {
    position: absolute; inset: -40px;
    font-family: 'JetBrains Mono', monospace; font-size: 17px; line-height: 27px;
    color: #8fb6dc; opacity: 0.075; white-space: pre; letter-spacing: 0.5px;
    transform: rotate(-4deg);
    -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 18%, #000 75%);
            mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 18%, #000 75%);
  }
  .center {
    position: absolute; left: 0; right: 0; top: 150px;
    display: flex; flex-direction: column; align-items: center;
  }
  .big {
    font-family: 'JetBrains Mono', monospace; font-weight: 800;
    font-size: 168px; line-height: 1; letter-spacing: -4px;
  }
  .big .uq { color: var(--dim); }
  .big .word {
    color: var(--text);
    text-shadow: 0 0 28px rgba(79, 195, 255, 0.55), 0 0 80px rgba(0, 152, 234, 0.45);
  }
  .big .cursor {
    display: inline-block; width: 22px; height: 132px; margin-left: 10px; vertical-align: -6px;
    background: var(--ton-soft); box-shadow: 0 0 24px rgba(79, 195, 255, 0.8);
  }
  .addr {
    margin-top: 40px;
    font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: 0.6px;
    color: rgba(143, 182, 220, 0.55);
    padding: 12px 22px; border-radius: 12px;
    background: rgba(5, 15, 28, 0.6); border: 1px solid rgba(79, 195, 255, 0.18);
  }
  .addr b { color: var(--ton-soft); font-weight: 700; }
  .addr .end { color: var(--text); font-weight: 700; }
  .footer {
    position: absolute; left: 64px; right: 64px; bottom: 46px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .name { font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
  .name span { color: var(--ton-soft); }
  .tag { font-weight: 500; font-size: 22px; color: #9db4cc; }
  .tag i { font-style: normal; color: var(--ton-soft); }
</style>
</head>
<body>
<div id="noise"></div>
<div class="center">
  <div class="big"><span class="uq">UQ</span><span class="word">Durov</span><span class="cursor"></span></div>
  <div class="addr" id="addr"></div>
</div>
<div class="footer">
  <div class="name">ton-<span>meme</span>-vanity</div>
  <div class="tag">funny TON wallet addresses · <i>GPU</i></div>
</div>
<script>
  // детерминированный ГПСЧ — картинка воспроизводима
  let s = 20261004;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  const randStr = (n) => Array.from({ length: n }, () => B64[Math.floor(rnd() * 64)]).join('');
  const lines = [];
  for (let r = 0; r < 30; r++) {
    let row = '';
    for (let c = 0; c < 4; c++) row += 'UQ' + 'ABCD'[Math.floor(rnd() * 4)] + randStr(45) + '   ';
    lines.push(row);
  }
  document.getElementById('noise').textContent = lines.join('\n');
  // адрес-пример (выдуманный, 48 символов): начало UQDurov + хвост-фраза
  const tail = '_to_the_MOON';
  const mid = randStr(48 - 7 - tail.length);
  const full = 'UQDurov' + mid + tail;
  if (full.length !== 48) throw new Error('длина ' + full.length);
  document.getElementById('addr').innerHTML = '<b>UQDurov</b>' + mid + '<span class="end">' + tail + '</span>';
</script>
</body>
</html>
