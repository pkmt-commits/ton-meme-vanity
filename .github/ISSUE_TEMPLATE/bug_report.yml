name: Bug report
description: Doesn't build, doesn't run or works incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Never paste the contents of `gems.jsonl`, `favorites.jsonl`, `hits*.txt`, `telegram.config.json`
        or `HIT ...` lines here — they contain private keys and the bot token.** Addresses (`UQ...`) are fine to show.
        Writing in Russian is fine too.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Output of `npm run setup`
      render: text
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and OS
      placeholder: RTX 4070, Windows 11
    validations:
      required: true
  - type: checkboxes
    id: keys
    attributes:
      label: Safety
      options:
        - label: I did not paste keys, seeds or the bot token
          required: true
