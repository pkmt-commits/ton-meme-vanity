<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@700;800&display=swap">
<style>
/* A gauge-like card: the address in monospace, found words highlighted with a marker; a rarity scale in bits */
:root{
  --bg:#eef1f5; --card:#ffffff; --fg:#141922; --muted:#5d6878; --line:#d9dfe8;
  --accent:#0f6fde; --mark:#ffe36e; --mark-fg:#1a1500; --uq:#9aa4b2; --good:#127a46; --soft:#e7effa;
  --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1117; --card:#151b24; --fg:#e8ecf2; --muted:#9aa6b6; --line:#273041; --accent:#62a6ff; --mark:#e9c93a; --mark-fg:#151100; --uq:#5f6b7c; --good:#5fd396; --soft:#182638; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1117; --card:#151b24; --fg:#e8ecf2; --muted:#9aa6b6; --line:#273041; --accent:#62a6ff; --mark:#e9c93a; --mark-fg:#151100; --uq:#5f6b7c; --good:#5fd396; --soft:#182638; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:18px}
h1{font:800 clamp(24px,5.4vw,36px)/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px}
label{font-weight:600;font-size:14px}
.inrow{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 300px;min-width:0;font:15px/1.3 var(--mono);padding:12px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 14px/1 var(--body);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.6;cursor:default}
.err{color:#c43d2b;font-size:14px;margin:0}
.result{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.score{display:grid;justify-items:center;gap:2px;min-width:118px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.score b{font:800 46px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.verdict{display:grid;gap:6px;min-width:0}
.verdict h2{font:700 20px/1.25 var(--body);margin:0;text-wrap:balance}
.rare{font-size:15px;color:var(--fg)}
.rare b{font-variant-numeric:tabular-nums}
.addr{font:700 clamp(13px,3.3vw,18px)/1.5 var(--mono);word-break:break-all;padding:12px;border-radius:10px;background:var(--bg);letter-spacing:.02em}
.addr .uq{color:var(--uq)}
.addr mark{background:var(--mark);color:var(--mark-fg);border-radius:3px;padding:0 1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--fg)}
.chip.tier{background:var(--accent);color:#fff;font-weight:600}
.meter{display:grid;gap:6px}
.bar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--line),var(--accent))}
.pin{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--fg);transform:translateX(-2px)}
.ticks{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
.ex{display:flex;flex-wrap:wrap;gap:8px}
.ex button{font:13px var(--mono);padding:8px 10px}
.small{font-size:13.5px;color:var(--muted);margin:0;max-width:66ch}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
dt{font:700 13px var(--mono);color:var(--accent)}
dd{margin:0;color:var(--fg)}
a{color:var(--accent)}
.lang{justify-self:end;font-size:14px;margin:0}
@media (max-width:480px){ .result{grid-template-columns:1fr} .score{justify-self:start;grid-auto-flow:column;align-items:baseline;gap:8px} }
@media (prefers-reduced-motion:no-preference){ .pin{transition:left .35s ease} }
</style>

<div class="wrap">
  <header style="display:grid;gap:8px">
    <p class="lang">{{lang}}</p>
    <h1>{{h1}}</h1>
    <p class="sub">{{sub}}</p>
  </header>

  <form class="card" id="f" autocomplete="off">
    <label for="a">{{addrLabel}}</label>
    <div class="inrow">
      <input id="a" name="a" spellcheck="false" placeholder="UQ…" value="UQC5PS0DCjuLHTFvAy-2WB3TfV5utOrqSHWmBNxY3ah2goaT">
      <button class="primary" type="submit">{{btnCheck}}</button>
      <button type="button" id="rnd">{{btnRandom}}</button>
    </div>
    <p class="err" id="err" hidden></p>
  </form>

  <section class="card" id="out" aria-live="polite">
    <div class="result">
      <div class="score"><b id="sc">0</b><span>{{points}}</span></div>
      <div class="verdict"><h2 id="vt"></h2><p class="rare" id="rr"></p></div>
    </div>
    <div class="addr" id="ad"></div>
    <div class="chips" id="ch"></div>
    <div class="meter">
      <div class="bar"><div class="pin" id="pin"></div></div>
      <div class="ticks"><span>0</span><span>100</span><span>150</span><span>200</span><span>250</span><span>300</span></div>
    </div>
    <p class="small" id="note"></p>
  </section>

  <section class="card">
    <h2 style="font:700 17px/1.3 var(--body);margin:0">{{huntTitle}}</h2>
    <p class="small">{{huntText}}</p>
    <div class="inrow"><button type="button" id="hunt">{{huntBtn}}</button></div>
    <p class="small" id="hs" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2 style="font:700 17px/1.3 var(--body);margin:0">{{exTitle}}</h2>
    <p class="small">{{exText}}</p>
    <div class="ex" id="ex"></div>
  </section>

  <section class="card">
    <h2 style="font:700 17px/1.3 var(--body);margin:0">{{howTitle}}</h2>
    <p class="small">{{howText}}</p>
    <dl>
      <dt>T1</dt><dd>{{t1}}</dd>
      <dt>T2</dt><dd>{{t2}}</dd>
      <dt>T3</dt><dd>{{t3}}</dd>
      <dt>TS</dt><dd>{{ts}}</dd>
      <dt>TM</dt><dd>{{tm}}</dd>
    </dl>
    <p class="small">{{taste}}</p>
  </section>
</div>

<script>/*SCORER*/</script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const T = /*T*/null;
  const RR = T.reasons.map(([p, r]) => [new RegExp(p), r]);
  const tr = (s) => s.split(', ').map((x) => RR.reduce((a, [p, r]) => a.replace(p, r), x)).join(', ');
  // Rarity: the share of addresses with score ≥ s. Below 150: a sample of 2 million random addresses, above: generator data.
  const LOW = {"20":2210,"40":4415,"60":10582,"80":23529,"100":74074,"120":200000};
  const HIGH = {"150":2296028,"160":3796484,"170":6522239,"180":11379409,"190":20622054,"200":36895640,"210":71392808,"220":137279255,"230":266067010,"240":477935185,"250":955870370,"260":1911740741,"280":3686928571,"300":17205666667};
  function oneIn(s){
    const hk = Object.keys(HIGH).map(Number).sort((a,b)=>a-b);
    if (s >= hk[0]) {
      let lo = hk[0];
      for (const k of hk) if (k <= s && HIGH[k]) lo = k;
      const base = HIGH[lo];
      return base * Math.pow(2, (s - lo) / 10);   // +10 points ≈ ×2
    }
    const lk = Object.keys(LOW).map(Number).sort((a,b)=>a-b);
    let lo = lk[0];
    for (const k of lk) if (k <= s) lo = k;
    const i = lk.indexOf(lo), hi = lk[i+1] ?? hk[0];
    const a = Math.log(LOW[lo]), b = Math.log(hi in LOW ? LOW[hi] : HIGH[hk[0]]);
    return Math.exp(a + (b - a) * (s - lo) / (hi - lo));
  }
  function fmtN(n){
    if (n < 1.5) return T.almostAll;
    for (const [v,w] of T.units) if (n >= v) { const x = n / v; return T.oneIn + (x >= 100 ? Math.round(x) : x.toFixed(x >= 10 ? 0 : 1)).toString().replace('.', T.dec) + ' ' + w; }
    return T.oneIn + Math.round(n);
  }
  function verdict(s){
    const V = T.verdicts;
    return s >= 300 ? V[0] : s >= 250 ? V[1] : s >= 200 ? V[2] : s >= 150 ? V[3] : s >= 100 ? V[4] : s >= 50 ? V[5] : V[6];
  }
  // CRC16-XMODEM + base64url: a random UQ address
  function crc16(b){ let c = 0; for (const x of b){ c ^= x << 8; for (let k = 0; k < 8; k++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff; } return c; }
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  function b64(b){ let s = ''; for (let i = 0; i < b.length; i += 3){ const n = (b[i] << 16) | (b[i+1] << 8) | b[i+2]; s += B64[(n>>18)&63] + B64[(n>>12)&63] + B64[(n>>6)&63] + B64[n&63]; } return s; }
  function randomUQ(){ const a = new Uint8Array(36); a[0] = 0x51; a[1] = 0; crypto.getRandomValues(a.subarray(2, 34)); const c = crc16(a.subarray(0, 34)); a[34] = c >> 8; a[35] = c & 255; return b64(a); }
  function b64d(s){ s = s.replace(/\+/g,'-').replace(/\//g,'_'); const o = []; for (let i = 0; i < s.length; i += 4){ const n = (B64.indexOf(s[i])<<18)|(B64.indexOf(s[i+1])<<12)|(B64.indexOf(s[i+2])<<6)|B64.indexOf(s[i+3]); o.push((n>>16)&255,(n>>8)&255,n&255); } return new Uint8Array(o); }
  // Any form (UQ/EQ, url-safe or not) → CRC check → the url-safe UQ form, as wallets show it
  function toUQ(raw){
    const s = raw.trim();
    if (!/^[A-Za-z0-9_\-+/]{48}$/.test(s)) return { err: T.errLen };
    const b = b64d(s);
    if (b.length !== 36 || b.slice(2,34).some((x) => x < 0)) return { err: T.errChars };
    const c = crc16(b.subarray(0, 34));
    if (((c >> 8) !== b[34]) || ((c & 255) !== b[35])) return { err: T.errCrc };
    if (b[1] !== 0) return { err: T.errWc };
    const was = s.slice(0, 2);
    const u = new Uint8Array(b); u[0] = (b[0] & 0x80) | 0x51; const c2 = crc16(u.subarray(0, 34)); u[34] = c2 >> 8; u[35] = c2 & 255;
    return { uq: b64(u), changed: was !== 'UQ' || /[+/]/.test(s), testnet: (b[0] & 0x80) !== 0 };
  }
  function mark(uq, words, reasons){
    const on = new Array(48).fill(false);
    const startTxt = reasons.find((r) => r.startsWith('start:')) || '';
    for (const w of words){
      const sp = w.span; if (!sp) continue;
      let i = startTxt.includes(sp) ? uq.indexOf(sp, 2) : uq.lastIndexOf(sp);
      if (i < 2) i = uq.indexOf(sp, 2);
      if (i >= 2) for (let k = i; k < i + sp.length; k++) on[k] = true;
    }
    let h = '<span class="uq">UQ</span>';
    for (let k = 2; k < 48; k++){
      const c = uq[k].replace('<','&lt;');
      if (on[k] && !on[k-1]) h += '<mark>';
      h += c;
      if (on[k] && (k === 47 || !on[k+1])) h += '</mark>';
    }
    return h;
  }
  function show(raw){
    const r = toUQ(raw);
    $('err').hidden = !r.err; $('out').hidden = !!r.err; if (r.err){ $('err').textContent = r.err; return; }
    const g = window.scoreV5(r.uq);
    const s = Math.max(0, g.score);
    $('sc').textContent = s;
    $('vt').textContent = verdict(s);
    const n = oneIn(s);
    $('rr').innerHTML = s < 50 ? T.rareMost : T.rareHtml.replace('{n}', fmtN(n));
    $('ad').innerHTML = mark(r.uq, g.words || [], g.reasons || []);
    const ch = [];
    if (g.label && s >= 50) ch.push('<span class="chip tier">' + g.label.split(':')[0] + '</span>');
    for (const x of (g.reasons || []).slice(0, 6)) ch.push('<span class="chip">' + tr(x).replace(/</g,'&lt;') + '</span>');
    if (!ch.length) ch.push('<span class="chip">' + T.noWords + '</span>');
    $('ch').innerHTML = ch.join('');
    $('pin').style.left = Math.min(100, s / 300 * 100) + '%';
    $('note').textContent = r.changed ? T.noteChanged : (r.testnet ? T.noteTestnet : '');
  }
  const EX = ['UQC5PS0DCjuLHTFvAy-2WB3TfV5utOrqSHWmBNxY3ah2goaT','UQDzdCq-qAR68Lq6KvweGQNDBsYUSVHSo96d25x4xa_0kUSh','UQBHZEO8PZ60426yiseuBbJBfSoICVT7TWBuMzW-Baaaaass','UQBLyA25xBc6o4Xwq7ZqJvtQ3HDPsgd4xiOXS7xtf219poor','UQAaPed5QqrkzPoCcm2zpdnWiTx9tfsMfILIk9Gd5-KNfarm','UQBUTTTTqcNR3XnNdRr_kWZyjMbZYYTCdkRNevbpAQQ7G7qP'];
  $('ex').innerHTML = EX.map((u) => '<button type="button" data-u="' + u + '">…' + u.slice(-12) + '</button>').join('');
  $('ex').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; $('a').value = b.dataset.u; show(b.dataset.u); });
  $('f').addEventListener('submit', (e) => { e.preventDefault(); show($('a').value); });
  $('rnd').addEventListener('click', () => { const u = randomUQ(); $('a').value = u; show(u); });
  $('a').addEventListener('paste', () => setTimeout(() => show($('a').value), 0));
  let busy = false;
  $('hunt').addEventListener('click', () => {
    if (busy) return; busy = true; $('hunt').disabled = true;
    const t0 = performance.now(); let n = 0, best = null;
    const step = () => {
      const until = performance.now() + 60;
      while (performance.now() < until) { const u = randomUQ(); const g = window.scoreV5(u); n++; if (!best || g.score > best.s) best = { u, s: g.score }; }
      const sec = (performance.now() - t0) / 1000;
      $('hs').textContent = T.huntProgress.replace('{n}', n.toLocaleString(T.locale)).replace('{r}', Math.round(n / sec).toLocaleString(T.locale)).replace('{s}', best.s);
      if (sec < 10) { setTimeout(step, 0); return; }
      busy = false; $('hunt').disabled = false;
      $('a').value = best.u; show(best.u);
      $('hs').textContent += T.huntDone;
      $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    step();
  });
  show($('a').value);
})();
</script>
