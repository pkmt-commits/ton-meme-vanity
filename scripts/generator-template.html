<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@700;800&display=swap">
<style>
/* Search console: controls and counters on top, the best finds below; addresses in monospace, words with a marker */
:root{
  --bg:#eef1f5; --card:#ffffff; --fg:#141922; --muted:#5d6878; --line:#d9dfe8;
  --accent:#0f6fde; --mark:#ffe36e; --mark-fg:#1a1500; --uq:#9aa4b2; --soft:#e7effa; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#c43d2b;
  --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1117; --card:#151b24; --fg:#e8ecf2; --muted:#9aa6b6; --line:#273041; --accent:#62a6ff; --mark:#e9c93a; --mark-fg:#151100; --uq:#5f6b7c; --soft:#182638; --warn:#f2b45a; --warn-soft:#33270f; --bad:#ff7a66; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1117; --card:#151b24; --fg:#e8ecf2; --muted:#9aa6b6; --line:#273041; --accent:#62a6ff; --mark:#e9c93a; --mark-fg:#151100; --uq:#5f6b7c; --soft:#182638; --warn:#f2b45a; --warn-soft:#33270f; --bad:#ff7a66; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:18px}
h1{font:800 clamp(24px,5.4vw,36px)/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 17px/1.3 var(--body);margin:0}
p{margin:0}
.sub{color:var(--muted);max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:600 14px/1 var(--body);padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{font-size:14px;color:var(--muted)}
select,input[type=range]{font:14px var(--body)}
select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat b{font:700 20px/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--card)}
.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sc{font:800 22px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.meta{font-size:13px;color:var(--muted)}
.addr{font:700 clamp(12px,3.1vw,16px)/1.5 var(--mono);word-break:break-all;letter-spacing:.02em}
.addr .uq{color:var(--uq)}
.addr mark{background:var(--mark);color:var(--mark-fg);border-radius:3px;padding:0 1px}
.key{display:grid;gap:8px;background:var(--warn-soft);border-radius:10px;padding:10px 12px}
.key code{font:13px/1.5 var(--mono);word-break:break-all;user-select:all}
.key p{font-size:13.5px}
.small{font-size:13.5px;color:var(--muted);max-width:68ch}
.warn{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.warn b{color:var(--warn)}
.err{color:var(--bad);font-weight:600}
ol{margin:0;padding-left:20px;display:grid;gap:4px}
a{color:var(--accent)}
.lang{justify-self:end;font-size:14px}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>

<div class="wrap">
  <header style="display:grid;gap:8px">
    <p class="lang">{{lang}}</p>
    <h1>{{h1}}</h1>
    <p class="sub">{{sub}}</p>
  </header>

  <section class="card">
    <div class="row">
      <button class="primary" id="go">{{btnGo}}</button>
      <button id="stop" disabled>{{btnStop}}</button>
      <label for="thr">{{threads}}</label>
      <select id="thr"></select>
      <label for="ver">{{versions}}</label>
      <select id="ver"><option value="1">{{verW5}}</option><option value="4" selected>W5, V4R2, V3R2, V3R1</option></select>
    </div>
    <div class="stats">
      <div class="stat"><b id="sN">0</b><span>{{statN}}</span></div>
      <div class="stat"><b id="sR">0</b><span>{{statR}}</span></div>
      <div class="stat"><b id="sT">0:00</b><span>{{statT}}</span></div>
      <div class="stat"><b id="sB">—</b><span>{{statB}}</span></div>
    </div>
    <p class="small" id="status">{{statusIdle}}</p>
  </section>

  <section class="card">
    <h2>{{bestTitle}}</h2>
    <ol class="list" id="list"><li class="small">{{listEmpty}}</li></ol>
  </section>

  <section class="warn">
    <b>{{secTitle}}</b>
    <p>{{sec1}}</p>
    <p>{{sec2}}</p>
    <p>{{sec3}}</p>
  </section>

  <section class="card">
    <h2>{{howTitle}}</h2>
    <ol class="small">
      <li>{{how1}}</li>
      <li>{{how2}}</li>
      <li>{{how3}}</li>
      <li>{{how4}}</li>
    </ol>
  </section>
</div>

<script>/*WORKER_SRC*/</script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const T = /*T*/null;
  const RR = T.reasons.map(([p, r]) => [new RegExp(p), r]);
  const tr = (s) => s.split(', ').map((x) => RR.reduce((a, [p, r]) => a.replace(p, r), x)).join(', ');
  const ERR = { start: T.errStart, keys: T.errKeys, addr: T.errAddr };
  const cores = Math.max(1, navigator.hardwareConcurrency || 4);
  for (let i = 1; i <= cores; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i; if (i === Math.max(1, cores - 1)) o.selected = true; $('thr').appendChild(o); }
  const workerUrl = URL.createObjectURL(new Blob([document.getElementById('wsrc').textContent], { type: 'text/javascript' }));
  let workers = [], counts = [], best = [], t0 = 0, timer = 0, running = false;
  const fmt = (n) => { const [b, m, k] = T.units; return n >= b[0] ? (n / b[0]).toFixed(2).replace('.', T.dec) + b[1] : n >= m[0] ? (n / m[0]).toFixed(1).replace('.', T.dec) + m[1] : n >= k[0] ? Math.round(n / k[0]) + k[1] : String(n); };
  function mark(uq, words, reasons){
    const on = new Array(48).fill(false), startTxt = (reasons || []).find((r) => r.startsWith('start:')) || '';
    for (const w of words || []) { const sp = w.span; if (!sp) continue; let i = startTxt.includes(sp) ? uq.indexOf(sp, 2) : uq.lastIndexOf(sp); if (i < 2) i = uq.indexOf(sp, 2); if (i >= 2) for (let k = i; k < i + sp.length; k++) on[k] = true; }
    let h = '<span class="uq">UQ</span>';
    for (let k = 2; k < 48; k++) { if (on[k] && !on[k-1]) h += '<mark>'; h += uq[k]; if (on[k] && (k === 47 || !on[k+1])) h += '</mark>'; }
    return h;
  }
  function render(){
    if (!best.length) return;
    $('list').innerHTML = best.map((r, i) => '<li class="item"><div class="top"><span class="sc">' + r.score + '</span><span class="meta">' + r.label.split(':')[0] + ' · ' + r.ver + ' · ' + r.reasons.slice(0, 2).map(tr).join('; ') + '</span></div>'
      + '<div class="addr">' + mark(r.uq, r.words, r.reasons) + '</div>'
      + '<div class="row"><button data-i="' + i + '" data-a="key">' + T.btnShowKey + '</button><button data-i="' + i + '" data-a="copyaddr">' + T.btnCopyAddr + '</button></div>'
      + (r.open ? '<div class="key"><code>' + r.seed + '</code><div class="row"><button data-i="' + i + '" data-a="copykey">' + T.btnCopyKey + '</button></div><p>' + T.keyNote + (r.ver !== 'W5' ? T.switchVer.replace('{v}', r.ver) : '') + '</p></div>' : '')
      + '</li>').join('');
  }
  $('list').addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return; const r = best[+b.dataset.i]; if (!r) return;
    if (b.dataset.a === 'key') { r.open = !r.open; render(); }
    else { const text = b.dataset.a === 'copykey' ? r.seed : r.uq; try { await navigator.clipboard.writeText(text); b.textContent = T.copied; } catch { b.textContent = T.copyManual; } }
  });
  function onMsg(i, m){
    if (m.err) { stop(); $('status').innerHTML = '<span class="err">' + (ERR[m.err] || m.err) + (m.msg ? ': ' + String(m.msg).replace(/</g, '&lt;') : '') + '</span>'; return; }
    if (m.ready) return;
    counts[i] = m.n;
    for (const r of m.found || []) {
      if (best.some((x) => x.uq === r.uq)) continue;
      best.push(r); best.sort((a, b) => b.score - a.score); best = best.slice(0, 12);
    }
    if (m.found && m.found.length) render();
  }
  function tick(){
    const n = counts.reduce((a, b) => a + b, 0), sec = (performance.now() - t0) / 1000;
    $('sN').textContent = fmt(n); $('sR').textContent = fmt(Math.round(n / Math.max(sec, 0.001)));
    $('sT').textContent = Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
    $('sB').textContent = best.length ? best[0].score : '—';
  }
  function start(){
    if (running) return; running = true; $('go').disabled = true; $('stop').disabled = false; $('thr').disabled = true; $('ver').disabled = true;
    const k = +$('thr').value, ver = +$('ver').value; counts = new Array(k).fill(0); t0 = performance.now();
    $('status').textContent = T.statusRunning;
    for (let i = 0; i < k; i++) { const w = new Worker(workerUrl); w.onmessage = (e) => onMsg(i, e.data); w.postMessage({ ver, min: 120 }); workers.push(w); }
    timer = setInterval(tick, 500);
  }
  function stop(){
    for (const w of workers) w.terminate(); workers = []; running = false; clearInterval(timer); tick();
    $('go').disabled = false; $('stop').disabled = true; $('thr').disabled = false; $('ver').disabled = false;
    $('go').textContent = T.btnContinue;
    $('status').textContent = T.statusStopped;
  }
  $('go').addEventListener('click', start); $('stop').addEventListener('click', stop);
})();
</script>
